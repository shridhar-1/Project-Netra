<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Netra (Cyber Eye)</title>

    <!-- ✅ ZOHO CATALYST SDK - FIXED TO v4.0.0 -->
    <script src="https://static.zohocdn.com/catalyst/sdk/js/4.0.0/catalystWebSDK.js"></script>
    <script src="/__catalyst/sdk/init.js"></script>
    <script>
        window.KSP_OFFICER = null;

        window.addEventListener("load", function() {
            const overlay    = document.getElementById('ksp-security-overlay');
            const shieldText = document.getElementById('shield-text');

            // 🛑 FAILSAFE: Give the server 8 seconds maximum to respond
            const securityTimeout = setTimeout(() => {
                if (shieldText) {
                    shieldText.innerHTML = "⚠️ SESSION TIMEOUT. REBOOTING...";
                    shieldText.style.color = "#ff4444";
                }
                setTimeout(() => { window.location.replace('/__catalyst/auth/login'); }, 1000);
            }, 8000);

            // 🧠 THE TITANIUM FIX: Recursive Polling
            function verifyClearance() {
                if (!window.catalyst || !window.catalyst.auth) {
                    console.warn("Waiting for KSP Data Cores (Catalyst SDK) to initialize...");
                    setTimeout(verifyClearance, 200);
                    return;
                }

                try {
                    catalyst.auth.isUserAuthenticated().then((result) => {
                        clearTimeout(securityTimeout);
                        console.log("Access Granted. Officer Verified.");
                        window.KSP_OFFICER = result.content || result;

                        if (overlay) {
                            overlay.style.transition = "opacity 0.5s ease";
                            overlay.style.opacity = '0';
                            setTimeout(() => { overlay.style.display = 'none'; }, 500);
                        }

                        if (typeof renderOfficerBadge === 'function') renderOfficerBadge();

                    }).catch((err) => {
                        clearTimeout(securityTimeout);
                        if (shieldText) {
                            shieldText.innerHTML = "🚫 ACCESS DENIED. ROUTING TO LOGIN...";
                            shieldText.style.color = "#ff4444";
                        }
                        setTimeout(() => { window.location.replace('/__catalyst/auth/login'); }, 1000);
                    });
                } catch (error) {
                    clearTimeout(securityTimeout);
                    if (shieldText) shieldText.innerHTML = "❌ FATAL SDK ERROR. REBOOTING...";
                    setTimeout(() => { window.location.replace('/__catalyst/auth/login'); }, 1500);
                }
            }

            verifyClearance();
        });
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Segoe+UI:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 🚨 TACTICAL GRID BACKGROUND */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #060b13;
            background-image:
                linear-gradient(rgba(6, 11, 19, 0.85), rgba(6, 11, 19, 0.85)),
                repeating-linear-gradient(0deg, transparent, transparent 49px, #112035 50px),
                repeating-linear-gradient(90deg, transparent, transparent 49px, #112035 50px);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #e0e6ed;
        }

        /* 🛡️ COMMAND CENTER CONSOLE */
        #chat-container {
            width: 850px;
            max-width: 95%;
            background: rgba(10, 18, 30, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.1);
            border: 1px solid #1c2b45;
            border-top: 5px solid #d4af37;
        }

        /* 👁️ KSP HEADER TYPOGRAPHY */
        h2 {
            text-align: center;
            font-family: 'Rajdhani', sans-serif;
            color: #d4af37;
            font-size: 38px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
            margin-bottom: 5px;
        }

        p {
            color: #8fa3b5;
            text-align: center;
            margin-bottom: 25px;
            font-size: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* 🔴 CYBER EYE RED GLOW ANIMATION */
        .cyber-eye {
            display: inline-block;
            animation: red-pulse 2s infinite alternate;
        }

        @keyframes red-pulse {
            0%   { text-shadow: 0 0 10px rgba(176, 0, 32, 0.5); transform: scale(1); }
            100% { text-shadow: 0 0 25px rgba(255, 0, 0, 1), 0 0 40px rgba(176, 0, 32, 0.8); transform: scale(1.05); }
        }

        /* 🪪 OFFICER SESSION BADGE */
        #officer-badge-container {
            text-align: center;
            margin-bottom: 18px;
        }

        #officer-badge {
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            color: #6f8296;
            margin-bottom: 8px;
            text-transform: uppercase;
            display: inline-block;
        }

        #officer-badge span {
            color: #d4af37;
        }

        #logoutBtn {
            display: none;
            background: #060b13;
            color: #ff5c5c;
            border: 1px solid #ff5c5c;
            padding: 4px 12px;
            font-size: 11px;
            font-family: 'Rajdhani', sans-serif;
            cursor: pointer;
            border-radius: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0 0 5px rgba(255, 92, 92, 0.2);
        }

        #logoutBtn:hover {
            background: #ff5c5c;
            color: #060b13;
        }

        /* 🎛️ LANGUAGE TOGGLES */
        #language-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        #language-controls button {
            background: #112035;
            color: #8fa3b5;
            padding: 8px 18px;
            font-size: 13px;
            border-radius: 4px;
            border: 1px solid #1c2b45;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        #language-controls button:hover {
            background: #1c2b45;
            color: #fff;
            border-color: #d4af37;
        }

        .active-lang {
            background: rgba(212, 175, 55, 0.15) !important;
            color: #d4af37 !important;
            border-color: #d4af37 !important;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        /* ⌨️ INPUT FIELD (Recessed 3D) */
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            padding: 16px;
            font-size: 16px;
            border: 1px solid #1c2b45;
            outline: none;
            border-radius: 6px;
            background: #060b13;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.8);
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #d4af37;
            background: #0a111a;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.2);
        }

        /* 🔘 ACTION BUTTONS */
        button {
            border: none;
            cursor: pointer;
            transition: .3s;
            border-radius: 6px;
            font-weight: bold;
            padding: 16px 22px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #askBtn {
            background: linear-gradient(135deg, #d4af37, #aa8529);
            color: #060b13;
            border: 1px solid #e5c358;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
        }

        #askBtn:hover {
            background: linear-gradient(135deg, #e5c358, #d4af37);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            transform: translateY(-2px);
        }

        #micBtn {
            background: #b00020;
            color: white;
            width: 60px;
        }

        #micBtn:hover {
            background: #d32f2f;
            box-shadow: 0 0 15px rgba(176, 0, 32, 0.4);
        }

        /* 📜 SEARCH HISTORY CHIPS */
        #history-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .history-chip {
            background: rgba(11, 19, 32, 0.7);
            color: #8fa3b5;
            border: 1px solid rgba(143, 163, 181, 0.3);
            padding: 5px 12px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 0.5px;
        }

        .history-chip:hover {
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        /* 🤖 NETRA AI RESPONSE SCREEN */
        #answer-box {
            margin-top: 10px;
            min-height: 180px;
            max-height: 400px;
            background: #0b1320;
            border: 1px solid #1c2b45;
            border-left: 4px solid #d4af37;
            border-radius: 6px;
            padding: 20px;
            color: #d4e0eb;
            line-height: 1.7;
            white-space: pre-wrap;
            overflow-y: auto;
            position: relative;
        }

        /* █ TERMINAL BLINKING CURSOR */
        .terminal-cursor::after {
            content: ' █';
            color: #d4af37;
            animation: blink 1s step-start infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .loading {
            color: #d4af37;
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite;
        }

        /* Shared by loading text AND security overlay shield */
        @keyframes pulse {
            0%   { opacity: 0.6; }
            50%  { opacity: 1; text-shadow: 0 0 10px #d4af37; }
            100% { opacity: 0.6; }
        }

        .success {
            color: #d4af37;
            font-family: 'Rajdhani', sans-serif;
            font-size: 20px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #1c2b45;
            padding-bottom: 5px;
        }

        .error {
            color: #ff5c5c;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 🚨 KSP SECURITY OVERLAY -->
    <div id="ksp-security-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #060b13; z-index: 99999; display: flex; justify-content: center; align-items: center; flex-direction: column; color: #d4af37; font-family: 'Rajdhani', sans-serif;">
        <div style="font-size: 60px; animation: pulse 1.5s infinite;">🛡️</div>
        <h2 id="shield-text" style="margin-top: 20px; letter-spacing: 3px; color: #d4af37; text-shadow: 0 0 15px rgba(212,175,55,0.5);">VERIFYING KSP CLEARANCE...</h2>
    </div>

    <!-- ✅ MAIN APP — hidden behind the overlay until auth passes -->
    <div id="chat-container">
        <h2><span class="cyber-eye">👁️</span> Project Netra AI</h2>
        <p>Ask Netra anything about Karnataka Police Crime Records.</p>

        <!-- ✅ 🪪 Verified Session Identity & Logout Button -->
        <div id="officer-badge-container">
            <div id="officer-badge">🔒 Verifying secure session...</div>
            <br>
            <button id="logoutBtn">Disconnect Session ⏏️</button>
        </div>

        <!-- Language Buttons -->
        <div id="language-controls">
            <button id="btn-kannada">ಕನ್ನಡ (Kannada)</button>
            <button id="btn-english" class="active-lang">English</button>
            <button id="btn-kanglish">Kan + Eng</button>
        </div>

        <div class="input-group">
            <input
                type="text"
                id="userInput"
                placeholder="Ask Netra..."
                lang="en"
            >
            <button id="micBtn" title="Speak">🎙️</button>
            <button id="askBtn">Ask</button>
        </div>

        <!-- 📜 SEARCH HISTORY CHIPS CONTAINER -->
        <div id="history-container"></div>

        <!-- 🤖 Active Console with Blinking Tactical Cursor -->
        <div id="answer-box">
            <span class="terminal-cursor">Welcome to Project Netra. Tactical Terminal Engaged.</span>
        </div>
    </div>

    <script>
        // ============================
        // ✅ 🪪 SHOW VERIFIED OFFICER & LOGOUT LOGIC
        // ============================
        function renderOfficerBadge() {
            const badge     = document.getElementById("officer-badge");
            const logoutBtn = document.getElementById("logoutBtn");
            if (!badge) return;

            const officer = window.KSP_OFFICER;

            if (officer) {
                const details = officer.user_details || officer;
                const name    = [details.first_name, details.last_name].filter(Boolean).join(" ");
                const email   = details.email_id || "";
                badge.innerHTML = "🔒 Secure Session — <span>" + (name || email || "Authorized Officer") + "</span>";
                if (logoutBtn) logoutBtn.style.display = "inline-block";
            } else {
                badge.innerHTML = "🔒 Secure Session — <span>Authorized Officer</span>";
            }
        }

        // ⏏️ SECURE LOGOUT LISTENER
        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
            logoutBtn.addEventListener("click", () => {
                logoutBtn.innerHTML = "DISCONNECTING... ⏳";
                logoutBtn.style.background = "#ff5c5c";
                logoutBtn.style.color = "#060b13";
                const redirectURL = window.location.origin + "/__catalyst/auth/login";
                catalyst.auth.signOut(redirectURL);
            });
        }


        // ============================
        // 💾 SEARCH HISTORY STORAGE LOGIC
        // ============================
        function saveSearchToHistory(searchQuery) {
            if (!searchQuery) return;

            let history = JSON.parse(localStorage.getItem('netra_history')) || [];

            if (!history.includes(searchQuery)) {
                history.unshift(searchQuery);
            }

            history = history.slice(0, 5);
            localStorage.setItem('netra_history', JSON.stringify(history));
            renderHistory();
        }

        function getSearchHistory() {
            return JSON.parse(localStorage.getItem('netra_history')) || [];
        }

        function renderHistory() {
            const historyContainer = document.getElementById("history-container");
            const history = getSearchHistory();

            historyContainer.innerHTML = "";

            history.forEach(query => {
                const chip = document.createElement("button");
                chip.className   = "history-chip";
                chip.textContent = "🕒 " + query;
                chip.title       = query;

                chip.addEventListener("click", () => {
                    questionInput.value = query;
                    askNetra();
                });

                historyContainer.appendChild(chip);
            });
        }


        // ============================
        // LANGUAGE & KEYBOARD CONTROL
        // ============================
        let selectedLanguage = 'english';

        const answerBox     = document.getElementById("answer-box");
        const questionInput = document.getElementById("userInput");
        const askBtn        = document.getElementById("askBtn");

        const btnKannada  = document.getElementById("btn-kannada");
        const btnEnglish  = document.getElementById("btn-english");
        const btnKanglish = document.getElementById("btn-kanglish");

        function updateActiveButton() {
            btnKannada.classList.remove("active-lang");
            btnEnglish.classList.remove("active-lang");
            btnKanglish.classList.remove("active-lang");

            if (selectedLanguage === "kannada") {
                btnKannada.classList.add("active-lang");
            } else if (selectedLanguage === "english") {
                btnEnglish.classList.add("active-lang");
            } else {
                btnKanglish.classList.add("active-lang");
            }
        }

        function setLanguage(lang) {
            selectedLanguage = lang;

            if (lang === "kannada") {
                questionInput.setAttribute("lang", "kn");
                questionInput.placeholder = "ನೇತ್ರಾಗೆ ಕೇಳಿ...";
            } else {
                questionInput.setAttribute("lang", "en");
                questionInput.placeholder = "Ask Netra...";
            }

            updateActiveButton();
            console.log("Language set to:", selectedLanguage);
        }

        btnKannada.addEventListener("click",  () => setLanguage("kannada"));
        btnEnglish.addEventListener("click",  () => setLanguage("english"));
        btnKanglish.addEventListener("click", () => setLanguage("kanglish"));


        // ============================
        // CHAT LOGIC
        // ============================
        async function askNetra() {
            const question = questionInput.value.trim();

            if (question === "") {
                answerBox.innerHTML = "<div class='error'>Please enter a question.</div>";
                return;
            }

            saveSearchToHistory(question);

            answerBox.innerHTML = "<div class='loading'>🔍 NETRA AI IS ANALYZING THE DATA CORES...</div>";

            try {
                const response = await fetch("/server/netra_backend/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({
                        message:  question,
                        language: selectedLanguage
                    })
                });

                // 🔐 Session expired or rejected server-side → back to secure login
                if (response.status === 401 || response.status === 403) {
                    answerBox.innerHTML =
                        "<div class='error'>🚫 SESSION EXPIRED. RE-AUTHENTICATING...</div>";
                    setTimeout(() => {
                        window.location.replace('/__catalyst/auth/login');
                    }, 1200);
                    return;
                }

                const data = await response.json();

                // ============================
                // 🛡️ CYBER-DOSSIER UI UPGRADE
                // ============================
                if (data.status === "success") {
                    let cleanAnswer = data.ai_answer || "";

                    // Step 1: Extract answer from tagged or prefixed format
                    if (cleanAnswer.includes("<answer>")) {
                        cleanAnswer = cleanAnswer.split("<answer>")[1].split("</answer>")[0].trim();
                    } else if (cleanAnswer.includes("Final Answer:")) {
                        cleanAnswer = cleanAnswer.split("Final Answer:")[1].trim();
                    }

                    // Step 2: Strip markdown bold asterisks entirely
                    cleanAnswer = cleanAnswer.replace(/\*\*/g, '');

                    // Step 3: Upgrade labels to High-Tech Solid Gold Badges
                    // (Dark text on gold for extreme contrast — monospace font for tactical look)
                    cleanAnswer = cleanAnswer.replace(
                        /(Accused:|Case Details:|Place:|ಆರೋಪಿಗಳು:|ಪ್ರಕರಣದ ವಿವರಗಳು:|ಸ್ಥಳ:)/gi,
                        '<div style="margin-top: 18px; margin-bottom: 8px;">' +
                        '<span style="background: linear-gradient(90deg, #d4af37, #c5a017); color: #000; font-size: 11px; font-weight: 900; padding: 4px 12px; border-radius: 3px; letter-spacing: 2px; text-transform: uppercase; box-shadow: 0 0 12px rgba(212,175,55,0.4); font-family: \'Courier New\', monospace;">$1</span>' +
                        '</div>'
                    );

                    // Step 4: Clean up AI's messy line breaks
                    cleanAnswer = cleanAnswer.replace(/^(<br>)+/, '');
                    cleanAnswer = cleanAnswer.replace(/(<br>){2,}/g, '<br>');

                    // Step 5: Render into a glass-morphism intelligence dossier box
                    answerBox.innerHTML =
                        "<div style='color: #d4af37; font-family: \"Courier New\", monospace; font-size: 12px; letter-spacing: 2px; border-bottom: 1px solid rgba(212,175,55,0.2); padding-bottom: 10px; margin-bottom: 15px; text-transform: uppercase;'>✦ Netra Intelligence Stream Active</div>" +
                        "<div style='font-family: \"Segoe UI\", system-ui, sans-serif; font-size: 15px; line-height: 1.8; letter-spacing: 0.3px; color: #e2e8f0; padding: 15px 20px; background: rgba(0,0,0,0.25); border-left: 3px solid #d4af37; border-radius: 0 8px 8px 0; box-shadow: inset 0 0 20px rgba(0,0,0,0.5);'>" +
                        cleanAnswer +
                        "</div>";

                } else {
                    answerBox.innerHTML =
                        "<div class='error'>" +
                        (data.error || "Unknown server error.") +
                        "</div>";
                }

            } catch (error) {
                console.error(error);
                answerBox.innerHTML =
                    "<div class='error'>❌ UNABLE TO RE-ESTABLISH LINK WITH BACKEND CORE.</div>";
            }
        }

        askBtn.addEventListener("click", askNetra);

        questionInput.addEventListener("keypress", function(e) {
            if (e.key === "Enter") askNetra();
        });


        // ============================
        // MICROPHONE - V3 (DIAGNOSTIC MODE)
        // ============================
        const micBtn           = document.getElementById("micBtn");
        const questionInputObj = document.getElementById("userInput");

        if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();

            recognition.continuous     = false;
            recognition.interimResults = true;

            micBtn.addEventListener("click", () => {
                recognition.lang = (selectedLanguage === "kannada") ? "kn-IN" : "en-IN";
                questionInputObj.placeholder = "Listening... Speak now!";
                questionInputObj.value = "";
                try { recognition.start(); } catch(e) {}
            });

            recognition.onstart = () => {
                micBtn.innerHTML = "🔴";
                micBtn.style.background = "#ff4444";
            };

            // 🛡️ Detects if the browser actually hears physical noise!
            recognition.onspeechstart = () => {
                if (questionInputObj.value === "") {
                    questionInputObj.placeholder = "Audio detected! Processing...";
                }
            };

            recognition.onresult = (event) => {
                let currentTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    currentTranscript += event.results[i][0].transcript;
                }
                questionInputObj.value = currentTranscript;
            };

            recognition.onend = () => {
                micBtn.innerHTML = "🎙️";
                micBtn.style.background = "#b00020";

                if (questionInputObj.value === "") {
                    questionInputObj.placeholder = "Mic turned off (No voice detected).";
                    setTimeout(() => setLanguage(selectedLanguage), 3000);
                } else {
                    setLanguage(selectedLanguage);
                }
            };

            recognition.onerror = (event) => {
                micBtn.innerHTML = "🎙️";
                micBtn.style.background = "#b00020";

                if (event.error === 'no-speech') {
                    questionInputObj.placeholder = "Error: No sound heard. Check Windows Mic settings!";
                } else if (event.error === 'not-allowed') {
                    questionInputObj.placeholder = "Error: Browser blocked microphone access.";
                } else {
                    questionInputObj.placeholder = "Mic error: " + event.error;
                }
                setTimeout(() => setLanguage(selectedLanguage), 4000);
            };

        } else {
            micBtn.style.display = "none";
        }

        // Initialize UI
        setLanguage("english");
        renderHistory();
    </script>

</body>
</html>
